<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Diva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="widget">
    <header class="titlebar">
      <span class="brand"><span class="dot"></span>Diva</span>
      <span id="clock" class="clock"></span>
      <button id="hide" class="icon-button" title="Masquer (raccourci global)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <section id="media" class="media idle">
      <div id="media-backdrop" class="media-backdrop"></div>
      <img id="cover" class="cover" alt="">
      <div class="track">
        <div id="title" class="title">Rien en lecture</div>
        <div id="artist" class="artist">Lance ta musique</div>
      </div>
      <div class="controls">
        <button data-media="prev" class="icon-button" title="Précédent">
          <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg>
        </button>
        <button id="play" data-media="toggle" class="icon-button play" title="Lecture / pause">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/></svg>
        </button>
        <button data-media="next" class="icon-button" title="Suivant">
          <svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg>
        </button>
      </div>
      <button id="open-spotify" class="spotify-button">Ouvrir Spotify</button>
    </section>

    <section>
      <h2>Setups</h2>
      <div id="setups" class="setups"></div>
    </section>

    <section>
      <h2>Apps</h2>
      <div id="apps" class="apps"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
