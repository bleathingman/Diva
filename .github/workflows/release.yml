# Fabrique l'installeur Windows et le publie en release GitHub à chaque tag de version.
# Les Diva installés la trouvent ensuite tout seuls (mises à jour automatiques).
#
# Pour publier une version :  npm version minor   (ou patch)
#                             git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # créer la release et y joindre l'installeur

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Un tag v0.5.0 doit publier la version 0.5.0 : sinon les mises à jour seraient incohérentes.
      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - run: npm ci

      # Pas de release si un test échoue.
      - run: npm test

      - name: Fabriquer l'installeur
        run: npm run dist

      # Release créée en une seule fois avec ses 3 fichiers. (electron-builder envoyait ses fichiers
      # en parallèle, et chaque envoi pouvait créer sa propre release : v0.5.0 en a eu deux.)
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Diva-Setup-$version.exe" \
            "dist/Diva-Setup-$version.exe.blockmap" \
            dist/latest.yml \
            --title "Diva $version" \
            --generate-notes
